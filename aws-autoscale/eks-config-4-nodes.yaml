apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: efa-agent-cluster
  region: us-east-1

iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: cluster-autoscaler
      namespace: kube-system
    attachPolicy:
      Version: "2012-10-17"
      Statement:
      - Effect: Allow
        Action:
        - "autoscaling:DescribeAutoScalingGroups"
        - "autoscaling:DescribeAutoScalingInstances"
        - "autoscaling:DescribeLaunchConfigurations"
        - "ec2:DescribeImages"
        - "ec2:DescribeInstanceTypes"
        - "ec2:DescribeLaunchTemplateVersions"
        - "ec2:GetInstanceTypesFromInstanceRequirements"
        - "autoscaling:DescribeTags"
        - "autoscaling:SetDesiredCapacity"
        - "autoscaling:TerminateInstanceInAutoScalingGroup"
        - "eks:DescribeNodegroup"        
        Resource: '*'

availabilityZones: ["us-east-1a", "us-east-1b", "us-east-1c"]
managedNodeGroups:
  - name: ng-c7a-large
    availabilityZones: ["us-east-1b"]
    instanceType: c7a.12xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 20
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-c7a-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-c7a-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  - name: ng-hpc7g-16xlarge
    availabilityZones: ["us-east-1a"]
    instanceType: hpc7g.16xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 20
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-hpc7g-16xlarge
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-hpc7g-16xlarge
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  - name: ng-c6in-large
    availabilityZones: ["us-east-1b"]
    instanceType: c6in.12xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 20
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-c6in-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-c6in-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  - name: ng-r7iz-large
    availabilityZones: ["us-east-1b"]
    instanceType: r7iz.8xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 20
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-r7iz-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-r7iz-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  # This will be a node to install to - "sticky node"
  # Placement group is intentionally omitted for this general-purpose node.
  - name: ng-t3-medium
    instanceType: t3.2xlarge
    volumeSize: 20
    volumeType: gp2
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-t3-medium
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-t3-medium
      Name: 'efa-agent-cluster'
    propagateASGTags: true

   # ARM instance
  - name: ng-m7g-large
    instanceType: m7g.16xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 30
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-m7g-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-m7g-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

    # --- Compute Optimized ---
  - name: ng-c6i-large
    instanceType: c6i.16xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 30
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-c6i-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-c6i-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

   # ARM instance
  - name: ng-c7g-large
    instanceType: c7g.16xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 30
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-c7g-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-c7g-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  # --- Memory Optimized ---
  - name: ng-r6i-large
    instanceType: r6i.8xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    amiFamily: AmazonLinux2
    volumeSize: 30
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-r6i-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-r6i-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  - name: ng-r7g-large
    instanceType: r7g.12xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 30
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-r7g-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-r7g-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true

  # --- Storage Optimized ---
  - name: ng-i4i-large
    instanceType: i4i.8xlarge
    efaEnabled: true
    placement:
      groupName: performance-study
    volumeSize: 30 # Root volume, actual NVMe is instance store
    volumeType: gp2
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    iam:
      withAddonPolicies:
        autoScaler: true
    tags:
      nodegroup: ng-i4i-large
      kubernetes.io/cluster/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/efa-agent-cluster: "owned"
      k8s.io/cluster-autoscaler/node-template/label/nodegroup: ng-i4i-large
      Name: 'efa-agent-cluster'
    propagateASGTags: true
