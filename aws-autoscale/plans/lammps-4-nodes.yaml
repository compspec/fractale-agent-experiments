name: Build and Deploy LAMMPS
description: Build a Docker container and deploy it as a Kubernetes Job.
plan:
- agent: build
  context:
    environment: "AWS CPU instance in Kubernetes to run across nodes"
    application: lammps-reax
    platforms: linux/amd64,linux/arm64
    container: ghcr.io/converged-computing/fractale-agent-experiments:lammps-reax
    push: true
    max_attempts: 10
    details: |
      You MUST use ghcr.io/converged-computing/fractale-agent-experiments:base-aws-efa as a base image. It includes OpenMPI 4.1.2 build with libfabric and --with-efa for AWS.
      Ensure all globbed files from examples/reaxff/HNS from the root of the lammps codebase are in the WORKDIR. Clone the latest branch of LAMMPS. You MUST put lmp on the PATH and run which lmp to ensure success. You MUST install libgomp1.
      You MUST build LAMMPS for a multi-node MPI environment

- agent: minicluster
  context:
    environment: "AWS CPU instance in Kubernetes" 
    container: ghcr.io/converged-computing/fractale-agent-experiments:lammps-reax
    max_attempts: 10
    max_runtime: 300
    allow_return_to_human: false
    allow_return_to_manager: false
    optimize: |
      You MUST maximize the LAMMPS FOM, k-atom or m-atom steps per second. 
      You MUST choose the largest problem size to maximize FOM. You MAY go up to 4 nodes. 
      You MUST set environment variables for MPI to use EFA with libfabric.
      You MUST NOT set PML to cm under any circumstances
    resources: |
      The resource spec you got earlier is for an autoscaling cluster, so the nodes possible are not there. You must add the nodeSelector to use node.kubernetes.io/instance-type m7g.16xlarge with 64 CPU, 256 GiB Memory, ARM (Graviton3). You are limited to up to 4 nodes.
    testing:
      Run in.reaxff.hns in the pwd with lmp -v x 2 -v y 2 -v z 2 -in ./in.reaxff.hns -nocite for testing only on one node.
    details: |
      You MUST run on up to 4 nodes and you MUST NOT change the MPI environment after it works.
      You MUST set the containers imagePullPolicy to Always.
      The Flux Operator uses flux run in the pwd with the tasks determined by the spec.tasks.
      You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1
      Since this is an ARM instance you MUST change the flux.container.image to be
      ghcr.io/converged-computing/flux-view-ubuntu:arm-focal and set flux.arch: "arm".
