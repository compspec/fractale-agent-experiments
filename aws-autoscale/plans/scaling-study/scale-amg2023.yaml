name: Scaling Study for AMG2023
description: Scale AMG2023 up to 32 nodes.
plan:
- agent: minicluster
  context:
    environment: "AWS CPU instance in Kubernetes to run across nodes"
    container: ghcr.io/converged-computing/fractale-agent-experiments:amg2023
    max_attempts: 10
    max_runtime: 600
    allow_return_to_human: false
    allow_return_to_manager: false
    sizes: [1,2,3,4,5]
    scale: |
      Weak scale AMG to maxime the FOM.
      You MUST choose a problem size at the smallest size (1) that you keep constant.
      Stop when you determine the application is no longer weak scaling.
    optimize: |
      Maximize the amg figure of merit. You MUST maximize memory per CPU core. More cores are better.
      You MUST choose a problem size running 'amg' with (-n) at size (1) that you MUST use at all larger sizes.
      You MUST NOT change problem size parameters after the first scaling size (1).
      You MUST make an effort to increase problem size at the first scaling size (1) until the job times out.
      You MUST decrease problem size if the pod is OOMKilled and try to optimize around that point.
      You MUST increase the problem size ONLY at the first scaling size until it stops improving in performance.
      You MUST set flux.optionFlags to "-o cpu-affinity=per-task"
      At large sizes, you MUST adhere to the same resource limits, requests, and node selectors.
      You MUST set environment variables for MPI to use EFA with libfabric.
      The trick to optimizing this is THREADING. You MUST force OpenMP and any math libraries to use only one thread per MPI rank. On example is setting OMP_NUM_THREADS to "1". You might also consider setting OMPI_MCA_btl_vader_single_copy_mechanism to "cma" as a conservative builder will set to none.
      You MUST adhere to ONE node (64 tasks) for the initial optimization.
    resources: Your nodes include the 64 CPU, 128 GiB Memory, ARM (Graviton3).
    testing: |
      You MUST run AMG -problem 2 and you MUST test on 1 node (size 1) to start. For testing You MUST choose a small problem size -P no greater than 4 in any dimension.
    details: | 
      You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1
      You MUST NOT oversubscribe, and you should run amg which is on the path.
      Since this is an ARM instance you MUST change the flux.container.image to be
      ghcr.io/converged-computing/flux-view-rocky:arm-9. Otherwise, do not change or set it.
      If you are using an ARM instance you MUST also set flux.arch: "arm".
