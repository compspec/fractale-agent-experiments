name: Build and Deploy Kripke
description: Build a Docker container and deploy it as a Kubernetes Job.
plan:
- agent: build
  context:
    environment: "AWS CPU instance in Kubernetes to run across nodes"
    application: kripke
    platforms: linux/arm64
    container: ghcr.io/converged-computing/fractale-agent-experiments:kripke
    push: true
    max_attempts: 10
    details: |
      You MUST use ghcr.io/converged-computing/flux-openmpi:ubuntu2204-efa-arm as a base image. It includes OpenMPI and libfabric provided from the efa installer for AWS and the entire Flux Framework stack.
      You MUST compile setting the cxx compiler to mpicxx and the c compiler to mpicc.
      Build kripke from its main branch. You MUST have MPI support enabled. You MUST ensure it is on the path.
      You MUST build for a multi-node MPI environment

- agent: minicluster
  context:
    environment: "AWS CPU instance in Kubernetes" 
    container: ghcr.io/converged-computing/fractale-agent-experiments:kripke
    max_attempts: 10
    max_runtime: 300
    allow_return_to_human: false
    allow_return_to_manager: false
    optimize: |
      Run Kripke. You MUST maximize the final reported Grind Time Figure of Merit. Change parameters as you need.
      You MAY go up to 4 nodes. You MUST make an effort to increase FOM as much as you can.
    resources: |
      The resource spec you got earlier is for an autoscaling cluster, so the nodes possible are not there. You must add the nodeSelector to use node.kubernetes.io/instance-type m7g.16xlarge with 64 CPU, 256 GiB Memory, ARM (Graviton3). You are limited to up to 4 nodes.
    testing:
      Run kripke with no parameters on 1 node.
    details: |
      You MUST run on up to 4 nodes and you MUST set flux.container.disable to true.
      You MUST set the containers imagePullPolicy to Always.
      The Flux Operator uses flux run in the pwd with the tasks determined by the spec.tasks.
      You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1
      Since this is an ARM instance you MUST change the flux.container.image to be
      ghcr.io/converged-computing/flux-view-ubuntu:arm-jammy and set flux.arch: "arm".
